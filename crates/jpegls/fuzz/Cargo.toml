[package]
name = "jpegls-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.75"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
jpegls = { path = "..", package = "pure_jpegls" }

[lib]
name = "jpegls_fuzz"
path = "src/lib.rs"
test = false
doc = false

# Prevent this fuzzing crate from being merged into the root workspace; it is
# nightly/cargo-fuzz-only and is listed in the root `[workspace] exclude`.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_image"
path = "fuzz_targets/decode_image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encode_gray"
path = "fuzz_targets/encode_gray.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encode_params"
path = "fuzz_targets/encode_params.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_lse"
path = "fuzz_targets/decode_lse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_mutated"
path = "fuzz_targets/decode_mutated.rs"
test = false
doc = false
bench = false
