[workspace]
resolver = "2"
members = [
    "crates/dicos",
    "crates/jpegrle",
    "crates/jpegls",
    "crates/jpegli",
    "crates/jpeg2k",
    "crates/roxel",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"
authors = ["JP Fielding <jp.fielding@gmail.com>"]
repository = "https://github.com/jpfielding/dicos.rs"
homepage = "https://github.com/jpfielding/dicos.rs"

[workspace.dependencies]
thiserror = "2"
byteorder = "1"
log = "0.4"
env_logger = "0.11"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Workspace crates
# version = alongside path so these are publishable to crates.io.
# The codec crates publish under `pure_*` package names (signalling pure Rust,
# and avoiding the taken `jpegli`/`jpeg2k` native-wrapper names) while keeping
# their plain lib names — imports and the dep keys below are unchanged.
dicos = { path = "crates/dicos", version = "1.0.0" }
jpegrle = { path = "crates/jpegrle", package = "pure_jpegrle", version = "1.0.0" }
jpegls = { path = "crates/jpegls", package = "pure_jpegls", version = "1.0.0" }
jpegli = { path = "crates/jpegli", package = "pure_jpegli", version = "1.0.0" }
jpeg2k = { path = "crates/jpeg2k", package = "pure_jpeg2k", version = "1.0.0" }

# CLI
clap = { version = "4", features = ["derive"] }

# Viewer
wgpu = "27"
winit = "0.30"
egui = "0.33"
egui-wgpu = { version = "0.33", features = ["winit"] }
egui-winit = "0.33"
glam = "0.29"
pollster = "0.4"
rfd = "0.15"
bytemuck = { version = "1", features = ["derive"] }

# Benchmarks
criterion = { version = "0.5", features = ["html_reports"] }
