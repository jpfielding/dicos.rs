[package]
name = "roxel"
description = "GPU-accelerated DICOS volume viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Viewer binary with heavy GPU deps — not published to crates.io.
publish = false

[[bin]]
name = "roxel"
path = "src/main.rs"

[dependencies]
dicos = { workspace = true, features = ["all-codecs"] }
thiserror.workspace = true
log.workspace = true
glam.workspace = true
half = { version = "2", features = ["bytemuck"] }
web-time = "1"

# GPU
wgpu.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true

# File dialog
rfd.workspace = true

# Data casting
bytemuck.workspace = true


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { workspace = true, features = ["clipboard", "links", "wayland", "x11"] }
pollster.workspace = true
rayon.workspace = true
env_logger.workspace = true
# Reproducible screenshots of the actual GPU-rendered workspace.
png = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Request", "RequestInit", "Response", "Headers"] }
console_log = "1"
console_error_panic_hook = "0.1"
